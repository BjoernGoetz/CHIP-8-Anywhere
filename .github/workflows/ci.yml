name: CI
on: push
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install clang-format
        run: pipx install clang-format==23.1.5
      - name: Check formatting
        run: ./format.sh --check

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: macos-latest
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: ./build.sh
      - run: tar czf chip8-terminal-${{ matrix.target }}.tar.gz -C build chip8
      - uses: actions/upload-artifact@v4
        with:
          name: chip8-terminal-${{ matrix.target }}
          path: chip8-terminal-${{ matrix.target }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [format, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --draft
          --notes ""
